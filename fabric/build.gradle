plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    include "com.electronwill.night-config:toml:3.6.0"
    include "com.electronwill.night-config:core:3.6.0"
    implementation "com.electronwill.night-config:core:3.6.0"
    implementation "com.electronwill.night-config:toml:3.6.0"

    include 'com.googlecode.soundlibs:jorbis:0.0.17.4'
    include "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
    include 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'
    implementation 'com.googlecode.soundlibs:jorbis:0.0.17.4'
    implementation 'com.googlecode.soundlibs:vorbisspi:1.0.3.3'
    implementation 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'

    include "io.github.BeardedManZhao:varFormatter:1.0.4"
    include "io.github.BeardedManZhao:algorithmStar:1.44"
    include "io.github.BeardedManZhao:mathematical-expression:1.5.6"

    implementation "io.github.BeardedManZhao:varFormatter:1.0.4"
    implementation "io.github.BeardedManZhao:algorithmStar:1.44"
    implementation "io.github.BeardedManZhao:mathematical-expression:1.5.6"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
